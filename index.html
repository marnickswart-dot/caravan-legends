const mat=(c,rough=1)=>new THREE.MeshStandardMaterial({color:c,roughness:rough});const sand=mat('#c9a46e'),stone=mat('#b9a083'),roof=mat('#435a58'),wood=mat('#5d3b2d'),goldmat=mat('#c5a36b',.42),cloth=mat('#334f69'),skin=mat('#b58a68'),red=mat('#8b3533');const geo={box:new THREE.BoxGeometry(1,1,1),sphere:new THREE.SphereGeometry(1,16,12),cone:new THREE.ConeGeometry(1,1,8),cyl:new THREE.CylinderGeometry(1,1,1,10)};function mesh(g,m,x=0,y=0,z=0,sx=1,sy=1,sz=1,parent=scene){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function box(x,y,z,sx,sy,sz,m,p=scene){return mesh(geo.box,m,x,y,z,sx,sy,sz,p)}

for(let z of [-62,-43,-22,22,43,62])for(let side of [-1,1]){const x=side*(15+Math.random()*8);pagoda(x,z,0.65+Math.random()*.28)}

function fallbackHuman(){const g=new THREE.Group();mesh(geo.sphere,skin,0,2.8,0,.3,.38,.29,g);mesh(geo.sphere,cloth,0,1.85,0,.55,.75,.32,g);for(const s of [-1,1]){mesh(geo.sphere,cloth,s*.64,2.08,0,.22,.55,.22,g);mesh(geo.sphere,cloth,s*.25,.85,0,.22,.66,.24,g)}mesh(geo.sphere,goldmat,0,3.1,0,.37,.15,.38,g);return g}
const heroRoot=new THREE.Group();heroRoot.position.set(save.x??0,0,save.z??8);scene.add(heroRoot);function equip(g){const sword=new THREE.Group();sword.position.set(.56,1.15,.1);g.add(sword);box(0,.3,0,.09,.85,.12,mat('#c9d9e1',.24),sword);box(0,-.12,0,.36,.09,.16,goldmat,sword);box(0,-.38,0,.09,.48,.12,wood,sword);return sword}let sword;try{const gltf=await loader.loadAsync(soldierURL);hero=gltf.scene;hero.scale.setScalar(1.35);hero.rotation.y=Math.PI;heroRoot.add(hero);hero.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});heroMixer=new THREE.AnimationMixer(hero);for(const clip of gltf.animations)heroActions[clip.name.toLowerCase()]=heroMixer.clipAction(clip);animated=true;sword=equip(heroRoot)}catch(e){console.warn('3D-model niet geladen, vereenvoudigd reservepersonage:',e);hero=fallbackHuman();heroRoot.add(hero);sword=equip(heroRoot)}

function updateHUD(){$('lv').textContent='Lv. '+game.lv;$('hptext').textContent=Math.ceil(game.hp)+'/'+(100+20*(game.lv-1));$('hp').style.width=(game.hp/(100+20*(game.lv-1))*100)+'%';$('mptext').textContent=Math.ceil(game.mp)+'/80';$('mp').firstElementChild.style.width=game.mp/80*100+'%';$('xptext').textContent=game.xp+'/'+game.lv*60;$('exp').firstElementChild.style.width=game.xp/(game.lv*60)*100+'%';$('gold').textContent=game.gold;$('kills').textContent=game.kills}updateHUD();let attackTime=0,spinTime=0;function attack(skill=false){if(attackTime>0)return;if(skill&&game.mp<25){notice('Niet genoeg MP');return}if(skill)game.mp-=25;attackTime=skill?1.15:.48;spinTime=skill?.65:.22;let hit=0;for(const e of enemies){if(!e.alive)continue;const d=e.group.position.distanceTo(heroRoot.position);if(d<(skill?6:3.3)){e.hp-=skill?65:32+game.lv*5;e.bar.scale.x=Math.max(0,e.hp/e.max);e.bar.position.x=-(1-e.hp/e.max)*.65;burst(e.group.position.x,1.7,e.group.position.z,skill?'#79cbff':'#ffd39a');hit++;if(e.hp<=0){e.alive=false;scene.remove(e.group);game.kills++;game.gold+=10+Math.floor(Math.random()*20);game.xp+=25;if(game.xp>=game.lv*60){game.xp-=game.lv*60;game.lv++;game.hp=100+20*(game.lv-1);notice('LEVEL UP! Level '+game.lv)}setTimeout(()=>spawn((Math.random()-.5)*60,-10-Math.random()*90),5000)}}}if(!hit)notice('Kom dichter bij een vijand');updateHUD()}

let joy={x:0,y:0},pid=null;const pad=$('joy'),nub=$('nub');function moveJoy(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const length=Math.hypot(dx,dy),max=40;if(length>max){dx=dx/length*max;dy=dy/length*max}joy.x=dx/max;joy.y=dy/max;nub.style.transform=`translate(${dx}px,${dy}px)`}pad.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;pad.setPointerCapture(pid);moveJoy(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)moveJoy(e)});function release(e){if(e.pointerId===pid){pid=null;joy.x=joy.y=0;nub.style.transform='translate(0,0)'}}pad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);
let last=performance.now(),saveClock=0;function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;if(heroMixer)heroMixer.update(dt);const length=Math.hypot(joy.x,joy.y);if(length>.12){const speed=7.5;heroRoot.position.x+=joy.x*dt*speed;heroRoot.position.z+=joy.y*dt*speed;heroRoot.position.x=THREE.MathUtils.clamp(heroRoot.position.x,-110,110);heroRoot.position.z=THREE.MathUtils.clamp(heroRoot.position.z,-110,110);heroRoot.rotation.y=Math.atan2(joy.x,joy.y);playAnim('walk')}else playAnim('idle');if(attackTime>0)attackTime-=dt;if(spinTime>0){spinTime-=dt;sword.rotation.z=Math.sin((.7-spinTime)*14)*1.5}else sword.rotation.z=0;for(const e of enemies){if(!e.alive)continue;const dist=e.group.position.distanceTo(heroRoot.position);if(dist<18&&dist>2.3){const dx=heroRoot.position.x-e.group.position.x,dz=heroRoot.position.z-e.group.position.z;e.group.position.x+=dx/dist*dt*1.8;e.group.position.z+=dz/dist*dt*1.8;e.group.rotation.y=Math.atan2(dx,dz)}e.cd-=dt;if(dist<2.5&&e.cd<=0){game.hp=Math.max(0,game.hp-9);e.cd=2;updateHUD();if(game.hp<=0){game.hp=100+20*(game.lv-1);heroRoot.position.set(0,0,8);notice('Je bent verslagen en opnieuw verschenen')}}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.userData.t-=dt;p.position.x+=p.userData.vx*dt;p.position.y+=p.userData.vy*dt;p.position.z+=p.userData.vz*dt;p.userData.vy-=15*dt;if(p.userData.t<=0){scene.remove(p);particles.splice(i,1)}}game.mp=Math.min(80,game.mp+dt*1.4);const target=new THREE.Vector3(heroRoot.position.x,heroRoot.position.y+8,heroRoot.position.z+13);camera.position.lerp(target,Math.min(1,dt*4));camera.lookAt(heroRoot.position.x,1.6,heroRoot.position.z-5);renderer.render(scene,camera);saveClock+=dt;if(saveClock>4){saveClock=0;localStorage.setItem('caravan-v05',JSON.stringify({...game,x:heroRoot.position.x,z:heroRoot.position.z}));updateHUD()}}requestAnimationFrame(frame);$('loading').remove();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;
